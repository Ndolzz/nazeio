name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buat Gradle wrapper bila belum ada
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build-log.txt 2>&1
          kode=$?
          tail -n 60 build-log.txt
          exit $kode

      - name: Upload APK sebagai artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nazeio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Laporkan error ke issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/Ndolzz/nazeio/actions/runs/${{ github.run_id }}
        run: |
          JUDUL="Build debug APK gagal"
          NOMOR=$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Build debug APK gagal") | .number' | head -n 1)
          SHA_PENDEK=${GITHUB_SHA:0:7}
          {
            echo "Build gagal pada commit $SHA_PENDEK."
            echo
            echo "Log run: $RUN_URL"
            echo
            echo "Potongan log akhir:"
            echo
            echo '~~~'
            tail -n 150 build-log.txt
            echo '~~~'
          } > isi-issue.txt
          if [ -n "$NOMUR" ] && [ "$NOMUR" != "" ]; then
            gh issue comment "$NOMUR" --body-file isi-issue.txt
          else
            gh issue create --title "$JUDUL" --body-file isi-issue.txt
          fi
